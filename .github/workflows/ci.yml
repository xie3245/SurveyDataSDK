name: C++ CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy-18 ninja-build

      - name: Configure static analysis
        run: >-
          cmake -S . -B build-quality -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DSURVEY_BUILD_TESTS=ON
          -DSURVEY_ENABLE_CLANG_TIDY=ON
          -DSURVEY_CLANG_TIDY:FILEPATH=/usr/bin/clang-tidy-18

      - name: Build with clang-tidy
        run: cmake --build build-quality --parallel 2

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            sanitizers: "OFF"
            os: ubuntu-24.04

          - build_type: Debug
            sanitizers: "ON"
            os: ubuntu-24.04

          - build_type: Release
            sanitizers: "OFF"
            os: windows-2022

          - build_type: Debug
            sanitizers: "OFF"
            os: windows-2022

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSURVEY_BUILD_TESTS=ON
          -DSURVEY_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  package:
    needs: [quality, build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure release bundle
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSURVEY_BUILD_TESTS=OFF

      - name: Build release bundle
        run: cmake --build build --parallel 2

      - name: Package SDK and demo
        run: cmake --install build --prefix package

      - name: Archive delivery bundle
        run: tar -czf survey-sdk-linux-x64.tar.gz -C package .

      - name: Retain delivery bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: survey-sdk-linux-x64
          path: survey-sdk-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
